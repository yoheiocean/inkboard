# Real client IP for PocketBase's login rate limiter: Cloudflare's header when the request
# came through Cloudflare, otherwise the connecting address.
map $http_cf_connecting_ip $inkboard_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # Always revalidate the shell so updates show up right away.
    location = / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
    }
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Code must stay in step with index.html; revalidation via ETag is cheap.
    # .mjs (pdf.js) must be served as JavaScript or module loading fails.
    location ~* \.(mjs|js|css)$ {
        types { text/javascript js mjs; text/css css; }
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
    }

    # ---- PocketBase API (same origin, so the CSP's connect-src 'self' covers it)
    # Docker's DNS is queried per request, so nginx starts even if the backend isn't up yet
    # and follows the container if its IP changes.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $pocketbase http://pocketbase:8090;

    # The admin UI and superuser API are only reachable on the LAN-only admin port (19411).
    # (Longer prefixes win over /api/ below; these also require a superuser token anyway.)
    location ^~ /_/ { return 404; }
    location ^~ /api/collections/_superusers/ { return 404; }
    location ^~ /api/backups { return 404; }
    location ^~ /api/settings { return 404; }
    location ^~ /api/logs { return 404; }
    location ^~ /api/crons { return 404; }
    location ^~ /api/collections/import { return 404; }
    location = /api/collections { return 404; }
    location = /api/collections/ { return 404; }

    # ^~ stops the regex locations above (e.g. .js) from matching API paths.
    location ^~ /api/ {
        proxy_pass $pocketbase;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $inkboard_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;   # PocketBase enforces the per-field limits
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }
}
